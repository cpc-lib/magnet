services:
  mysql:
    image: mysql:8.4
    container_name: magnet-mysql
    command:
      - --bind-address=0.0.0.0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-magnet}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: magnet
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmagnet"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: magnet-redis
    command:
      - redis-server
      - --bind
      - 0.0.0.0
      - --protected-mode
      - "no"
      - --appendonly
      - "yes"
    ports:
      - "0.0.0.0:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  libtorrent-worker:
    image: magnet-libtorrent-worker:latest
    build:
      context: ../native
    container_name: magnet-worker
    ports:
      - "127.0.0.1:50051:50051"   # 同宿主机 API 专用 gRPC
      - "0.0.0.0:6881:6881"     # DHT
      - "0.0.0.0:6881:6881/udp"
    # API 在宿主机 server/download-api 下以 STORAGE_ROOT=./data 运行时，与 Worker 的 /data 共享同一物理目录
    volumes:
      - ../server/download-api/data:/data
      - worker-locks:/locks
    restart: unless-stopped

  libtorrent-worker-2:
    profiles: [ha]
    image: magnet-libtorrent-worker:latest
    environment:
      WORKER_ID: local-worker-2
    ports:
      - "127.0.0.1:50052:50051"
    volumes:
      - ../server/download-api/data:/data
      - worker-locks:/locks
    restart: unless-stopped

  aria2:
    profiles: [http]
    build: ./aria2
    image: magnet-aria2:latest
    container_name: magnet-aria2
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      MAGNET_ARIA2_RPC_SECRET: ${MAGNET_ARIA2_RPC_SECRET:-}
    command:
      - |
        : "$${MAGNET_ARIA2_RPC_SECRET:?Set MAGNET_ARIA2_RPC_SECRET before starting aria2}"
        exec aria2c --enable-rpc=true --rpc-listen-all=true --rpc-secret="$${MAGNET_ARIA2_RPC_SECRET}" --dir=/data --continue=true --auto-save-interval=1 --file-allocation=none --enable-dht=false --enable-peer-exchange=false
    ports:
      - "127.0.0.1:6800:6800"
    volumes:
      - ../server/download-api/data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  worker-data:
  worker-locks:
