global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "magnet-platform"
    metrics_path: "/actuator/prometheus"
    scheme: "http"
    basic_auth:
      username: "prometheus"
      password_file: "/etc/prometheus/secrets/scrape-password"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: "magnet-platform"
          env: "dev"
